[package]
name = "agens-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
perf-audit = ["agens-perf/enabled"]

[[bin]]
name = "agens-perf-audit"
required-features = ["perf-audit"]

[dependencies]
agens-bus = { path = "../agens-bus" }
agens-core = { path = "../agens-core" }
agens-perf = { path = "../agens-perf" }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arborium = { version = "2.18.1", default-features = false, features = [
  "lang-bash",
  "lang-c",
  "lang-c-sharp",
  "lang-cpp",
  "lang-css",
  "lang-diff",
  "lang-go",
  "lang-html",
  "lang-java",
  "lang-javascript",
  "lang-json",
  "lang-markdown",
  "lang-nix",
  "lang-python",
  "lang-rust",
  "lang-sql",
  "lang-toml",
  "lang-tsx",
  "lang-typescript",
  "lang-yaml",
] }
arborium-highlight = { version = "2.18.1", default-features = false }
arborium-theme = { version = "2.18.1", default-features = false }
base64 = "0.22"
crossterm = "0.29"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
serde_json = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
