syntax = "proto3";

// The coordinator's client wire.
//
// Two planes that do not mix. `Team` moves the control plane on the user's
// authority; `Feed` only reads it. Neither carries an authorization surface of
// its own: the server's core decides what a principal reaches, and a facade is
// a transport that picks one.
//
// Lifecycle states, event classes and question kinds travel as the strings the
// control plane already stores them as, rather than as protobuf enums mirroring
// them. The vocabulary has one definition — the store's — and a second copy on
// the wire is a copy that can drift out of step with the rows it names.
//
// `Chat` is the third plane, and it is the user's own conversation rather than
// the design's chat-with-Praetor: a turn the daemon hosts on an attached
// client's behalf, so it survives the terminal that asked for it. It is not
// folded into `Feed` because a turn's progress is ephemeral and belongs to one
// session, while `Feed` carries the coordinator's persisted, repository-scoped
// journal; a provider delta has no business becoming a journal row.
package agens.coordinator.v1;

// One state machine transition, as the caller sees it.
message Transition {
  // False when the row already held the state the trigger leads to. Cancelling
  // twice reports this rather than failing.
  bool applied = 1;
  // Empty when nothing was applied.
  string from = 2;
  string to = 3;
}

message Ack {
  Transition transition = 1;
}

// A proposed execution, and the repository it is proposed against.
//
// The repository's identity is not here: the coordinator derives it from the
// checkout, because a client that named its own would decide which repository's
// runs its work is grouped with.
message CreateRunRequest {
  // The checkout the run's worktree is created from.
  string repo_root = 1;
  string task = 2;
  string scope = 3;
  string dod = 4;
  // Provenance of an imported task. Never followed back to its source.
  optional string external_ref = 5;
  // The run this one replans, inheriting its lineage.
  optional int64 parent_run_id = 6;
  // The run whose work has to land before this one is eligible.
  optional int64 dep_run_id = 7;
  string provider = 8;
  int64 priority = 9;
  optional int64 budget_tokens = 10;
  // The commit the run's branch starts from. Empty means the checkout's HEAD.
  string start_point = 11;
}

message CreateRunResponse {
  int64 run_id = 1;
  string repo_id = 2;
  string worktree_path = 3;
  // Provisioning hooks that failed and were continued past: the run starts in
  // an environment that is not what the repository declared.
  repeated string hook_failures = 4;
  // Whether the repository's declared provisioning hooks ran at all. False
  // when it declares hooks the operator has not authorized.
  bool hooks_ran = 5;
  // The durable question asking the operator to decide about this
  // repository's hooks, when creating this run opened one.
  optional int64 hook_authorization_question = 6;
}

message ApprovePlanRequest {
  int64 run_id = 1;
}

message AnswerQuestionRequest {
  int64 question_id = 1;
  string answer = 2;
}

// A question answered, and the run it unblocked when it blocked one.
message AnswerAck {
  int64 run_id = 1;
  Transition question = 2;
  // Absent when the run was not parked on this question.
  Transition run = 3;
}

message AuthorizeMergeRequest {
  // Which approval the grant is given on. An approval that does not exist yet
  // is opened by this same request, because the receipt it is bound to is
  // frozen from the worktree at the moment it is asked for.
  oneof subject {
    // An approval asked for earlier.
    int64 question_id = 1;
    // The run to open one for, over its worktree as it stands now.
    int64 run_id = 3;
  }
  // Recorded with the grant: whose authority a merge carried cannot be
  // reconstructed afterwards.
  string answer = 2;
  // Epoch seconds a newly opened approval expires at. Ignored when the grant
  // names an approval that already exists, which carries its own.
  optional int64 expires_at = 4;
}

// A merge authorization granted, and the approval it was granted on.
//
// The id is carried back because the pre-merge gate is presented with it, and
// for an approval this same request opened there is nowhere else to read it.
message AuthorizeMergeAck {
  int64 question_id = 1;
  int64 run_id = 2;
  Transition transition = 3;
}

message CancelRunRequest {
  int64 run_id = 1;
}

message RetryRequest {
  int64 run_id = 1;
  string guidance = 2;
  // How many chargeable attempts this run gets.
  int64 retry_budget = 3;
}

message CleaningRequest {
  int64 run_id = 1;
  // "reclaim" releases a worktree already shown to be merged; "dispose" throws
  // away an active one, and only a person's confirmation reaches it.
  string disposition = 2;
  // Set only by a client relaying that confirmation.
  bool confirmed = 3;
}

message TakeoverRequest {
  int64 run_id = 1;
}

// Where the run's live session is.
//
// The design sketched this as a stream of session IO. It is a handle instead,
// because the daemon has no session IO surface to stream yet, and a stream that
// never yields is a worse contract than a handle that says where to attach.
message TakeoverResponse {
  int64 run_id = 1;
  int64 session_id = 2;
}

message PauseAdmissionsRequest {
  bool paused = 1;
}

message StopRequest {
  oneof scope {
    int64 run_id = 1;
    string repo_id = 2;
    // Every session on this machine. Set it to true; false names no scope and
    // is refused.
    bool machine = 3;
  }
}

message AdmissionState {
  bool paused = 1;
  bool previously_paused = 2;
  bool changed = 3;
}

// The operations that move the control plane.
service Team {
  // Creates a proposed execution in `draft` and provisions its worktree. The
  // run reaches the queue only through ApprovePlan, which is the user's alone.
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc ApprovePlan(ApprovePlanRequest) returns (Ack);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerAck);
  rpc AuthorizeMerge(AuthorizeMergeRequest) returns (AuthorizeMergeAck);
  rpc CancelRun(CancelRunRequest) returns (Ack);
  rpc Retry(RetryRequest) returns (Ack);
  rpc Cleaning(CleaningRequest) returns (Ack);
  rpc Takeover(TakeoverRequest) returns (TakeoverResponse);
  rpc PauseAdmissions(PauseAdmissionsRequest) returns (AdmissionState);
  rpc Stop(StopRequest) returns (AdmissionState);
}

// One entry of the coordinator's append-only journal.
message Event {
  int64 id = 1;
  // Absent for a fact that belongs to no run, such as a provider's quota
  // resetting.
  optional int64 run_id = 2;
  string type = 3;
  // "agent" or "infra".
  string class = 4;
  string payload = 5;
  int64 ts = 6;
}

// What a subscriber wants to see.
//
// The repository is part of the filter because one daemon serves N projects, so
// an unfiltered stream would carry another repository's runs.
message EventFilter {
  optional string repo_id = 1;
  optional int64 run_id = 2;
  // Empty means every class.
  repeated string classes = 3;
}

message TreeRequest {
  // Required. One daemon serves N projects, so a tree without a repository
  // would hand a client another project's runs.
  string repo_id = 1;
}

// One run as the tree shows it.
//
// Identity here is the project and the branch, never the path: the worktree
// path is a copyable datum of the detail view, not how a run is recognized.
message RunSummary {
  int64 run_id = 1;
  string task = 2;
  string state = 3;
  int64 priority = 4;
  string provider = 5;
  optional string worktree_status = 6;
  optional int64 parent_run_id = 7;
  // Provenance of an imported task, never followed back to its source.
  optional string external_ref = 8;
  int64 created_at = 9;
}

message TreeSnapshot {
  string repo_id = 1;
  repeated RunSummary runs = 2;
}

message RunDetailRequest {
  int64 run_id = 1;
}

message Run {
  int64 run_id = 1;
  string repo_id = 2;
  string repo_root = 3;
  optional string remote_url = 4;
  optional string external_ref = 5;
  optional int64 parent_run_id = 6;
  string task = 7;
  string scope = 8;
  string dod = 9;
  // JSON array, absent until the first checkpoint carrying a diff freezes it.
  optional string genesis_paths = 10;
  string state = 11;
  int64 priority = 12;
  optional int64 dep_run_id = 13;
  string provider = 14;
  optional int64 budget_tokens = 15;
  optional string worktree_path = 16;
  optional string worktree_status = 17;
  int64 created_at = 18;
  optional string result = 19;
}

// One try at a run, with its own cost and duration.
message Attempt {
  int64 attempt_id = 1;
  int64 run_id = 2;
  int64 n = 3;
  optional int64 session_id = 4;
  optional int64 session_attempt_id = 5;
  int64 started_at = 6;
  optional int64 ended_at = 7;
  optional string outcome = 8;
  optional string retry_trigger = 9;
  optional int64 tokens = 10;
  // Cost in millionths of a currency unit, never a float.
  optional int64 cost_micros = 11;
}

message Question {
  int64 question_id = 1;
  int64 run_id = 2;
  // "question" or "approval".
  string kind = 3;
  string blocked_decision = 4;
  // JSON array of the options offered.
  string options = 5;
  optional string recommendation = 6;
  optional string answer = 7;
  optional string author = 8;
  optional int64 expires_at = 9;
  // The receipt an approval binds to: the bytes the user approved, not the run.
  optional string tree_hash = 10;
  optional string paths_digest = 11;
  string state = 12;
  int64 created_at = 13;
}

message Finding {
  int64 finding_id = 1;
  int64 run_id = 2;
  optional int64 checkpoint_id = 3;
  string description = 4;
  // "deterministic", "inferential" or "insufficient". Only the first credits
  // progress.
  string evidence_class = 5;
  // JSON array of references to whatever backs the claim.
  string proof_refs = 6;
  string causal_disposition = 7;
  int64 created_at = 8;
}

message RunHealth {
  int64 run_id = 1;
  optional int64 last_progress_turn = 2;
  int64 noop_turns = 3;
  optional string failing_test_signature = 4;
  int64 tokens_since_progress = 5;
  int64 updated_at = 6;
}

message RunView {
  Run run = 1;
  repeated Attempt attempts = 2;
  repeated Question questions = 3;
  repeated Finding findings = 4;
  repeated Event events = 5;
  // Absent until ingest has something to derive it from.
  optional RunHealth health = 6;
}

message InboxRequest {
  string repo_id = 1;
}

message InboxItem {
  int64 run_id = 1;
  int64 question_id = 2;
  string kind = 3;
  string blocked_decision = 4;
  string options = 5;
  optional string recommendation = 6;
  optional int64 expires_at = 7;
  int64 created_at = 8;
}

message InboxView {
  string repo_id = 1;
  repeated InboxItem items = 2;
}

// The read plane. Nothing here writes, so a reader cannot see a state that
// never happened and cannot cause one either.
service Feed {
  rpc Subscribe(EventFilter) returns (stream Event);
  rpc Tree(TreeRequest) returns (TreeSnapshot);
  rpc RunDetail(RunDetailRequest) returns (RunView);
  rpc Inbox(InboxRequest) returns (InboxView);
}

// A part of one message, as a turn produces it.
//
// The same five shapes the domain has. A part is carried structurally rather
// than as an encoded blob because a client renders it: a blob would make every
// surface parse the daemon's private encoding to draw a line of text.
message MessagePart {
  oneof part {
    string text = 1;
    string reasoning = 2;
    ToolCall tool_call = 3;
    ToolResult tool_result = 4;
    Media media = 5;
  }
}

message ToolCall {
  string id = 1;
  string name = 2;
  // The call's raw argument payload, exactly as the provider produced it.
  string input = 3;
}

message ToolResult {
  string tool_call_id = 1;
  string content = 2;
  bool is_error = 3;
}

message Media {
  int64 media_id = 1;
  string mime = 2;
}

message Usage {
  optional uint64 input_tokens = 1;
  optional uint64 output_tokens = 2;
  optional uint64 total_tokens = 3;
  optional uint64 context_window = 4;
}

// A transient provider failure the turn is about to retry.
//
// It carries no failure text: a client rendering this is describing what the
// turn is doing right now, not reporting an error anybody has to act on.
message ProviderRetry {
  uint32 attempt = 1;
  optional uint32 max_attempts = 2;
  optional uint64 delay_millis = 3;
  // "rate_limited", "server_error", "network", "timeout" or "transient".
  string reason = 4;
}

// Input that reached a running turn at a tool boundary.
message IntraTurnInput {
  // "human" or "supervisor". The two do not carry the same authority, so who
  // spoke is recorded rather than inferred.
  string source = 1;
  string text = 2;
}

// One thing a running turn did.
//
// The turn's own facts about tool results — the paths a write touched, the exit
// status of a command — are deliberately absent. They are what the daemon feeds
// its own ingest with, no surface renders them, and a run's health is already
// readable through `Feed`.
message TurnProgress {
  oneof event {
    // "idle", "requesting", "streaming", "dispatching", "completed",
    // "cancelled" or "failed".
    string state = 1;
    MessagePart provider_part = 2;
    Usage usage = 3;
    ToolCall tool_call_requested = 4;
    MessagePart tool_result = 5;
    ProviderRetry provider_retry = 6;
    IntraTurnInput intra_turn_input = 7;
  }
}

message TurnCompleted {
  string text = 1;
}

message TurnFailed {
  string detail = 1;
}

// A decision the turn cannot make for itself.
//
// The turn is stopped on this until somebody answers it, so a client that
// renders one has to be a client that can also answer.
message PermissionAsked {
  // What an answer names. Unique within one chat, and only while the question
  // is open.
  uint64 prompt_id = 1;
  // The bare tool name, as a person reads it.
  string tool = 2;
  string target = 3;
  string access = 4;
  string reason = 5;
}

message AnswerPermissionRequest {
  int64 session_id = 1;
  uint64 prompt_id = 2;
  // "allow_once", "allow_always", "deny_once" or "deny_always". A name this
  // daemon does not know is refused, never read as a permissive one.
  string answer = 3;
}

message AskUserOption {
  string id = 1;
  string label = 2;
  optional string explanation = 3;
  optional string context = 4;
}

message AskUserQuestion {
  string id = 1;
  string prompt = 2;
  optional string explanation = 3;
  // "single" or "multiple".
  string mode = 4;
  repeated AskUserOption options = 5;
  bool allow_other = 6;
  bool allow_note = 7;
  bool allow_discuss = 8;
}

message AskUserAsked {
  uint64 prompt_id = 1;
  optional string title = 2;
  repeated AskUserQuestion questions = 3;
}

message AskUserAnswer {
  string question_id = 1;
  repeated string selected = 2;
  optional string other = 3;
  optional string note = 4;
}

message AskUserAnswered { repeated AskUserAnswer answers = 1; }
message AskUserDiscuss {
  string question_id = 1;
  optional string note = 2;
}
message AskUserCancelled {}
message AskUserUnavailable { string reason = 1; }

message AskUserReply {
  oneof reply {
    AskUserAnswered answered = 1;
    AskUserDiscuss discuss = 2;
    AskUserCancelled cancelled = 3;
    AskUserUnavailable unavailable = 4;
  }
}

message AnswerAskUserRequest {
  int64 session_id = 1;
  uint64 prompt_id = 2;
  AskUserReply reply = 3;
}

// The chat has ended and will publish nothing further.
message ChatClosed {}

// One thing a hosted chat did, as a subscriber sees it.
message SessionEvent {
  int64 session_id = 1;
  oneof event {
    TurnProgress progress = 2;
    TurnCompleted turn_completed = 3;
    TurnFailed turn_failed = 4;
    ChatClosed closed = 5;
    PermissionAsked permission_asked = 6;
    AskUserAsked ask_user_asked = 7;
  }
}

message OpenChatRequest {
  // The checkout the chat's tools run in.
  //
  // A path rather than a repository id, for the reason `CreateRunRequest`
  // takes one: the daemon derives the identity from the checkout, and a
  // repository that has never had a run has no id for a client to name.
  string checkout = 1;
  // The stored session to continue, when the client is resuming one.
  optional int64 resume = 2;
}

message ChatHandle {
  int64 session_id = 1;
  // A client must see this before sending media. False is the compatible default
  // returned by daemons that predate structured prompt parts.
  bool supports_prompt_parts = 2;
}

message PromptRequest {
  int64 session_id = 1;
  // Text-only compatibility projection for daemons that predate `parts`.
  string prompt = 2;
  // Authoritative when non-empty. Empty means the legacy prompt above.
  repeated MessagePart parts = 3;
}

message ChatCommandRequest {
  int64 session_id = 1;
  string command = 2;
}

message ChatCommandResult { string message = 1; }

// One open chat, named.
message ChatRef {
  int64 session_id = 1;
}

message ChatAck {}

message ListChatsRequest {
  // Required. One daemon serves N projects, and a terminal offered another
  // project's conversation is a terminal that can attach to the wrong one.
  string checkout = 1;
}

// One chat the daemon is hosting.
message OpenChat {
  int64 session_id = 1;
  string checkout = 2;
  // Whether a turn is running right now, so a client that comes back
  // mid-answer can say so rather than looking idle.
  bool answering = 3;
}

// The chats open against one checkout, newest first.
message OpenChats {
  repeated OpenChat chats = 1;
}

// One message of a conversation.
message Message {
  // "system", "user", "assistant", "tool" or "supervisor". A string for the
  // reason every other vocabulary here is one: the set has a definition
  // already, and a protobuf enum beside it is a second copy that can drift.
  string role = 1;
  repeated MessagePart parts = 2;
}

// What a chat has said so far.
//
// A snapshot, not a stream: it is what a terminal coming back needs in order to
// draw the conversation it left, and what happens next arrives on `Subscribe`.
message ChatHistory {
  repeated Message messages = 1;
}

enum HostedCatalogKind {
  HOSTED_CATALOG_KIND_UNSPECIFIED = 0;
  HOSTED_CATALOG_KIND_COMMAND = 1;
  HOSTED_CATALOG_KIND_SKILL = 2;
}

message HostedCatalogRequest {
  HostedCatalogKind kind = 1;
  optional string known_revision = 2;
}

message HostedCatalogEntry {
  string name = 1;
  string description = 2;
  bool built_in = 3;
}

message HostedCatalogSnapshot {
  string revision = 1;
  repeated HostedCatalogEntry entries = 2;
}

message HostedCatalogStale { string current_revision = 1; }
message HostedUnsupported {}
message HostedCatalogResult {
  oneof result {
    HostedCatalogSnapshot current = 1;
    HostedCatalogStale stale = 2;
    HostedUnsupported unsupported = 3;
  }
}

message WorkspaceFilesRequest {
  string checkout = 1;
  string selector = 2;
}

message WorkspaceFileRequest {
  string checkout = 1;
  string selector = 2;
}

enum HostedFileKind {
  HOSTED_FILE_KIND_UNSPECIFIED = 0;
  HOSTED_FILE_KIND_TEXT = 1;
  HOSTED_FILE_KIND_MEDIA = 2;
}

enum HostedFileError {
  HOSTED_FILE_ERROR_UNSPECIFIED = 0;
  HOSTED_FILE_ERROR_INVALID_SELECTOR = 1;
  HOSTED_FILE_ERROR_OUTSIDE_ROOT = 2;
  HOSTED_FILE_ERROR_IGNORED = 3;
  HOSTED_FILE_ERROR_MISSING = 4;
  HOSTED_FILE_ERROR_UNSUPPORTED = 5;
  HOSTED_FILE_ERROR_OVERSIZED = 6;
  HOSTED_FILE_ERROR_ENTRY_LIMIT = 7;
  HOSTED_FILE_ERROR_UNREADABLE = 8;
}

message HostedWorkspaceFile {
  string path = 1;
  uint64 byte_len = 2;
  HostedFileKind kind = 3;
}

message HostedWorkspaceFileList { repeated HostedWorkspaceFile files = 1; }
message HostedWorkspaceFileText { string path = 1; string text = 2; }
message HostedWorkspaceFileMedia { string path = 1; string mime = 2; bytes bytes = 3; optional int64 media_id = 4; }
message HostedWorkspaceFilesResult {
  oneof result {
    HostedWorkspaceFileList files = 1;
    HostedFileError error = 2;
  }
}
message HostedWorkspaceFileResult {
  oneof result {
    HostedWorkspaceFileText text = 1;
    HostedWorkspaceFileMedia media = 2;
    HostedFileError error = 3;
  }
}


enum HostedTaskState {
  HOSTED_TASK_STATE_UNSPECIFIED = 0;
  HOSTED_TASK_STATE_RUNNING = 1;
  HOSTED_TASK_STATE_BACKGROUND = 2;
  HOSTED_TASK_STATE_COMPLETED = 3;
  HOSTED_TASK_STATE_CANCELLED = 4;
  HOSTED_TASK_STATE_FAILED = 5;
}
message HostedTaskRecord { string task_id = 1; HostedTaskState state = 2; }
message HostedTaskEvent { uint64 cursor = 1; string task_id = 2; HostedTaskState state = 3; string payload = 4; }
message HostedChildTurn { string task_id = 1; uint64 sequence = 2; string payload = 3; }
message HostedTaskSnapshot { uint64 cursor = 1; repeated HostedTaskRecord tasks = 2; repeated HostedChildTurn child_turns = 3; }
message HostedTaskEvents { repeated HostedTaskEvent events = 1; }
message HostedTaskSnapshotTail { HostedTaskSnapshot snapshot = 1; repeated HostedTaskEvent events = 2; }
message HostedTaskGap { uint64 oldest_cursor = 1; }
enum HostedTaskError {
  HOSTED_TASK_ERROR_UNSPECIFIED = 0;
  HOSTED_TASK_ERROR_WRONG_SESSION = 1;
  HOSTED_TASK_ERROR_UNKNOWN_TASK = 2;
  HOSTED_TASK_ERROR_INVALID_TRANSITION = 3;
  HOSTED_TASK_ERROR_COMMAND_CONFLICT = 4;
  HOSTED_TASK_ERROR_CONTROL_CAPACITY = 5;
  HOSTED_TASK_ERROR_INVALID_REQUEST = 6;
  HOSTED_TASK_ERROR_STORAGE = 7;
}
message HostedTaskReplayResult {
  oneof result { HostedTaskEvents events = 1; HostedTaskSnapshotTail snapshot_tail = 2; HostedTaskGap gap = 3; HostedTaskError error = 4; }
}
message HostedTaskSnapshotRequest { int64 session_id = 1; }
message HostedTaskReplayRequest { int64 session_id = 1; uint64 after_cursor = 2; }
enum HostedTaskControlKind {
  HOSTED_TASK_CONTROL_KIND_UNSPECIFIED = 0;
  HOSTED_TASK_CONTROL_KIND_BACKGROUND = 1;
  HOSTED_TASK_CONTROL_KIND_CANCEL = 2;
  HOSTED_TASK_CONTROL_KIND_CANCEL_ALL = 3;
  HOSTED_TASK_CONTROL_KIND_MESSAGE = 4;
}
message HostedTaskControlRequest { int64 session_id = 1; string task_id = 2; string command_id = 3; HostedTaskControlKind kind = 4; string message = 5; }
message HostedTaskControlApplied { HostedTaskState state = 1; bool replayed = 2; }
message HostedTaskControlResult { oneof result { HostedTaskControlApplied applied = 1; HostedTaskError error = 2; } }


enum HostedMcpState {
  HOSTED_MCP_STATE_UNSPECIFIED = 0;
  HOSTED_MCP_STATE_DISABLED = 1;
  HOSTED_MCP_STATE_IDLE = 2;
  HOSTED_MCP_STATE_CONNECTING = 3;
  HOSTED_MCP_STATE_READY = 4;
  HOSTED_MCP_STATE_DEGRADED = 5;
  HOSTED_MCP_STATE_FAILED = 6;
  HOSTED_MCP_STATE_CLOSED = 7;
}
enum HostedMcpAction {
  HOSTED_MCP_ACTION_UNSPECIFIED = 0;
  HOSTED_MCP_ACTION_CONNECT = 1;
  HOSTED_MCP_ACTION_DISCONNECT = 2;
  HOSTED_MCP_ACTION_RECONNECT = 3;
}
message HostedMcpServer { string name = 1; HostedMcpState state = 2; uint64 generation = 3; optional string error = 4; }
message HostedMcpStatusRequest {}
message HostedMcpControlRequest { string server = 1; HostedMcpAction action = 2; }
message HostedMcpResult { repeated HostedMcpServer servers = 1; optional string error = 2; }

// The attach handshake, asked before a client opens or joins anything.
message BuildInfoRequest {}

// The daemon's account of what it is, for a client deciding whether the
// process on the socket still serves its contract.
message DaemonBuild {
  // The client/daemon contract revision. Two processes with the same revision
  // are compatible whatever their builds; two with different revisions are the
  // skew that produces wrong answers rather than refusals.
  uint64 wire_revision = 1;
  // The build the daemon was compiled from: crate version plus git commit.
  // Compared for equality only; a commit hash does not order.
  string build = 2;
  // Chats whose turn is running right now. A launcher may only replace a
  // daemon that is answering nobody.
  int64 answering_chats = 3;
}

// The chat plane: the user's own conversation, hosted by the daemon.
//
// `Prompt` returns as soon as the turn has somewhere to start, not when it
// finishes. What the turn does arrives on `Subscribe`, which is what lets a
// client detach from a turn without ending it — and lets another one attach to
// a turn already under way.
service Chat {
  // Who the daemon is, answered before a client commits to it. A daemon that
  // predates this RPC answers `Unimplemented`, which a client reads as a
  // build too old to describe itself.
  rpc BuildInfo(BuildInfoRequest) returns (DaemonBuild);
  rpc Catalog(HostedCatalogRequest) returns (HostedCatalogResult);
  rpc ListWorkspaceFiles(WorkspaceFilesRequest) returns (HostedWorkspaceFilesResult);
  rpc ReadWorkspaceFile(WorkspaceFileRequest) returns (HostedWorkspaceFileResult);
  rpc McpStatus(HostedMcpStatusRequest) returns (HostedMcpResult);
  rpc McpControl(HostedMcpControlRequest) returns (HostedMcpResult);
  rpc TaskSnapshot(HostedTaskSnapshotRequest) returns (HostedTaskReplayResult);
  rpc TaskReplay(HostedTaskReplayRequest) returns (HostedTaskReplayResult);
  rpc TaskControl(HostedTaskControlRequest) returns (HostedTaskControlResult);
  rpc Open(OpenChatRequest) returns (ChatHandle);
  rpc Prompt(PromptRequest) returns (ChatAck);
  rpc Command(ChatCommandRequest) returns (ChatCommandResult);
  // Ends the turn a chat is running and leaves the session open.
  rpc Cancel(ChatRef) returns (ChatAck);
  // Ends the session, letting the turn it may be running finish first.
  rpc Close(ChatRef) returns (ChatAck);
  rpc Subscribe(ChatRef) returns (stream SessionEvent);
  // What is already open for a checkout, so a terminal that detached comes
  // back to its conversation instead of starting a second one beside it.
  rpc List(ListChatsRequest) returns (OpenChats);
  // What the chat has said so far, so a terminal that comes back draws the
  // conversation it left rather than an empty one.
  rpc History(ChatRef) returns (ChatHistory);
  // Answers a question the chat's turn is stopped on.
  rpc AnswerPermission(AnswerPermissionRequest) returns (ChatAck);
  rpc AnswerAskUser(AnswerAskUserRequest) returns (ChatAck);
}
