[package]
name = "agens-tui-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fixtures the binary's tests reach for. `cfg(test)` never reaches a dependency,
# so a consumer opts in here; production builds never enable it.
test-support = ["dep:agens-fixtures", "dep:ratatui"]

[dependencies]
agens-agents = { path = "../agens-agents" }
agens-auth = { path = "../agens-auth" }
agens-bootstrap = { path = "../agens-bootstrap" }
agens-bus = { path = "../agens-bus" }
agens-callcount = { path = "../agens-callcount" }
agens-config = { path = "../agens-config" }
agens-core = { path = "../agens-core" }
agens-diagnostics = { path = "../agens-diagnostics" }
agens-dispatch = { path = "../agens-dispatch" }
agens-error = { path = "../agens-error" }
agens-headless = { path = "../agens-headless" }
agens-models = { path = "../agens-models" }
agens-permissions = { path = "../agens-permissions" }
agens-providers = { path = "../agens-providers" }
agens-session = { path = "../agens-session" }
agens-store = { path = "../agens-store" }
agens-tool-runtime = { path = "../agens-tool-runtime", features = ["probe"] }
agens-tools = { path = "../agens-tools" }
agens-fixtures = { path = "../agens-fixtures", optional = true }
agens-tui = { path = "../agens-tui" }
ratatui = { version = "0.30.2", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
agens-fixtures = { path = "../agens-fixtures" }
ratatui = "0.30.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
