# Agens configuration example.
#
# Copy this file to one of these locations:
#   Global:  ~/.config/agens/config.toml
#   Project: <project-root>/.agens/config.toml
#
# Project values override global values. MCP servers and
# agent.bypass_permission_prompts are global-only.

[options]
# Capture provider and subagent diagnostics under the data directory.
debug = true
# Override the runtime-state directory when needed.
# data_dir = "${XDG_DATA_HOME:-~/.local/share}/agens"

[provider]
# Use "openai-api" instead when authenticating with OPENAI_API_KEY.
type = "openai-chatgpt"
model = "gpt-5.5"
# base_url = "https://api.openai.com/v1"

[agent]
# Uncomment to replace the assembled system prompt.
# system_prompt = "You are a careful coding agent."
# max_iterations = 60
parallel_tool_calls = true
# This setting is honored only in the global configuration.
bypass_permission_prompts = false
default_agent = "primary"
# Allowed values: none, minimal, low, medium, high, xhigh, max.
reasoning_effort = "high"

[ui]
collapse_thinking = false

[tools]
max_list_entries = 1000
max_search_entries = 10000
max_search_results = 100
max_search_depth = 32
operation_timeout_ms = 5000
bash_timeout_ms = 120000

[subagents]
max_iterations = 16
max_concurrency = 4
max_output_chars = 65536

[mcp_defaults]
timeout_ms = 30000
max_retries = 0

# Named agent profiles can select a model and reasoning effort.
[agents.primary]
model = "gpt-5.5"
effort = "high"

# A target in parentheses is a glob; a tool named without one matches every
# target, so `deny bash` and `deny bash(*)` name the same calls.
#
# What decides a call is the rule that selects the fewest calls, never the file
# a rule was written in or its position in the list. Where two rules select the
# same calls the more restrictive decision wins: deny, then ask, then allow. A
# project rule beats a global one only because it selects fewer calls. Because
# the narrower rule wins, a narrow `allow` deliberately carves an exception out
# of a broad `deny`: `deny write(src/**)` beside `allow write(src/generated/**)`
# permits the generated subtree and nothing else under `src`.
#
# For path-shaped targets (read/write/edit/list/search/glob/grep/webfetch) a
# bare `*` never crosses a `/`; only an explicit `**` segment does. `bash`
# targets are free-form command text, so a bare `*` there does cross `/` —
# `bash(rm *)` already matches `rm -rf /tmp/x`. A `bash` rule is matched
# against each command in a chained line (`&&`, `||`, `;`, `|`, `$(...)`,
# `sh -c`), seeing through wrappers such as `sudo` and reducing `/bin/rm` to
# `rm`. That closes the ordinary evasions; it is pattern matching, not a
# sandbox, and a command written to hide which binary it runs still can.
#
# Name every tool you mean. `read`, `write` and `edit` are separately
# registered tools, so denying a path to one says nothing about the other two.
# `grep` is matched on its pattern AND on the path it is given, and a deny on
# either refuses the call — that is what makes the `grep` line below hold, and
# it is load-bearing, because `grep` reports the lines it matched. `glob` is
# matched on its pattern alone and `bash` on its command line, so a path deny
# never reaches those two; granting `bash` grants a way around every path rule
# below.
#
# What the `grep` deny costs, stated once: a search given no path — or rooted
# at the worktree itself — reads whatever it walks, so any `grep` deny refuses
# it. Name a path to scope the search. A search rooted at a directory is
# matched on that directory and not on the files under it, so a deny naming
# one file below it does not stop a search rooted above it.
#
# A delegated subagent may use `read`, `list`, `search`, `grep`, `glob` and
# `git_read` without declaring anything, and every deny below binds it exactly
# as it binds the primary agent. What `glob` reports is file paths and never
# their contents, and no path deny bounds it on either path.
[permissions]
allow = [
  "read(**)",
  "list(**)",
  "search(**)",
  "bash(git status *)",
]
deny = [
  "read(**/.env)",
  "write(**/.env)",
  "edit(**/.env)",
  "search(**/.env)",
  "grep(**/.env)",
  "bash(rm *)",
]
# Reserve `ask` for operations a human should confirm. A rule that matches is
# never upgraded by `/bypass`, `--dangerously-allow-all`, or dangerous mode;
# those only decide calls no rule names. A delegated subagent cannot reach the
# prompt, so an `ask` refuses there, saying the prompt was unreachable.
ask = [
  "bash(git commit*)",
  "bash(git push*)",
]

